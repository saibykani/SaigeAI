# Local development stack. For production, point MONGODB_URI at MongoDB Atlas instead of the
# bundled `mongo` service.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
    ports: ["8000:8000"]
    depends_on:
      mongo: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args: { BACKEND_URL: http://backend:8000 }
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  mongo-data:
